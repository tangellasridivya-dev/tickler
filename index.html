<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the soft indigo wash behind the top bar (tokens.css --top-gradient),
         not the flat page background, so the OS status bar blends into the header
         instead of showing as a differently-coloured strip above it. This is what
         Android (and a regular Safari tab) use. -->
    <meta name="theme-color" content="#e8e7f8" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#1e1f33" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <!-- iOS ignores theme-color once the app is added to the home screen — it only
         looks at this pair. "black-translucent" makes the status bar an overlay, so
         the gradient (not a solid colour) shows through it, same as a regular tab.
         HomePage.css pads content below it with env(safe-area-inset-top). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Your personal and family task assistant." />
    <title>Tickler</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
